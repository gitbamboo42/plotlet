name: site

# Deployed manually only: Actions tab -> site -> Run workflow, picking
# the ref to build (a release tag, or main). Every page shows the
# plotlet version it was built from.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Not -e: an editable plotlet hides the separately installed
      # plotlet.extensions package, and the gallery silently vanishes.
      - run: pip install . mistune==3.1.4
      # The extensions gallery page. The import check makes a broken
      # install fail the build instead of shipping a gallery-less site.
      # statsmodels is loess's optional dependency — without it the
      # gallery drops the loess tile.
      - run: |
          pip install git+https://github.com/gitbamboo42/plotlet-extensions.git statsmodels
          python -c "import plotlet.extensions"
      - run: python site/gen_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
